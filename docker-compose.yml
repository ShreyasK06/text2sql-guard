# Full stack on one port: `docker compose up --build` starts PostgreSQL, seeds it with synthetic data,
# and runs the API, which also serves the built React app at http://localhost:8000.
# Database only (for local development without Docker for the app): python scripts/db.py up
services:
  postgres:
    image: postgres:16-bookworm
    container_name: t2s-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: t2s
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${T2S_SUPERUSER_PASSWORD:-t2s_local_dev_only}
    ports:
      - "54329:5432"
    volumes:
      - t2s_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      # -h 127.0.0.1 so the check only passes once the real server (not the init-time
      # socket-only server) is listening.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d t2s"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  seed:
    build: .
    command: ["python", "-m", "db.seed"]
    environment: &t2s_env
      T2S_DB_HOST: postgres
      T2S_DB_PORT: "5432"
      T2S_LLM_PROVIDER: mock
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment: *t2s_env
    volumes:
      - t2s_audit:/data/audit
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  t2s_pgdata:
  t2s_audit:
