# Render Blueprint: New -> Blueprint -> pick this repo. One free web service, no separate database
# (PostgreSQL runs inside the container; see Dockerfile.render for why).
services:
  - type: web
    name: text2sql-guard
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-bolt-e4b
      - key: LLM_RATE_LIMIT_PER_MIN
        value: "20"
      # Secrets: Render asks for these in the dashboard and never stores them in this file.
      - key: NVIDIA_API_KEY
        sync: false
      - key: ACCESS_CODE
        sync: false
